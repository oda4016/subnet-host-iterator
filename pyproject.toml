[project]
name = "subnet-host-iterator"
version = "0.1.0"
description = "Yield all usable host addresses in a given IPv4 or IPv6 subnet, skipping the network and broadcast addresses where applicable."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
